name: Deploy key broker

on:
  push:
    branches: [main]
    paths:
      - "Server/key-broker/**"
      - ".github/workflows/deploy-key-broker.yml"
  pull_request:
    paths:
      - "Server/key-broker/**"
  workflow_dispatch:

concurrency:
  group: deploy-key-broker
  cancel-in-progress: false

defaults:
  run:
    working-directory: Server/key-broker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/key-broker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate staff Worker bindings and bundle
        run: npx wrangler deploy --dry-run --config wrangler.staff.jsonc

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/key-broker/package-lock.json
      - run: npm ci
      - name: Prepare reviewer credentials
        env:
          APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          APP_REVIEW_CODE_HASH: ${{ secrets.APP_REVIEW_CODE_HASH }}
        run: node scripts/prepare-review-credentials.mjs "$RUNNER_TEMP/lively-review-secrets.json"
      # Migrations first, so the new code never runs against an old schema.
      - run: npx wrangler d1 migrations apply lively-key-broker --remote
      - run: npx wrangler deploy
      - name: Configure reviewer credentials
        run: |
          if [ -f "$RUNNER_TEMP/lively-review-secrets.json" ]; then
            npx wrangler secret bulk "$RUNNER_TEMP/lively-review-secrets.json"
          fi
      - name: Remove temporary reviewer credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/lively-review-secrets.json"
